
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Information AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary px-4">
        <span class="navbar-brand fw-bold">PublicInfo AI</span>
        <span class="text-white">Information Assistant</span>
    </nav>

    <main class="container py-5">
        <div class="chat-card mx-auto">
            <div class="text-center mb-4">
                <h1>Public Information Assistant</h1>
                <p class="text-secondary">
                    Ask questions about organizations, locations, services and public directories.
                </p>
            </div>

            <div id="chat-box" class="chat-box">
                <div class="message bot">
                    Hello! How can I help you find public information today?
                </div>
            </div>

            <form id="chat-form" class="d-flex gap-2 mt-3">
                <input
                    id="message"
                    class="form-control"
                    placeholder="Ask your question..."
                    autocomplete="off"
                    required
                >
                <button class="btn btn-primary" type="submit">Send</button>
            </form>

            <p class="small text-secondary mt-3 mb-0">
                Verify important details using the official source.
            </p>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
